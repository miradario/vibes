<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibes - Checklist de QA manual</title>
    <style>
      :root {
        --bg: #fefefd;
        --ink: #2b2b2b;
        --muted: #6e6e6e;
        --line: rgba(43, 43, 43, 0.12);
        --mustard: #e4b76e;
        --coral: #d88c7a;
        --soft: rgba(228, 183, 110, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 56px;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: flex-end;
        border-bottom: 1px solid var(--line);
        padding-bottom: 22px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1.05;
        font-weight: 300;
        letter-spacing: 0;
      }

      .meta {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .count {
        min-width: 132px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        text-align: right;
        background: white;
      }

      .count strong {
        display: block;
        font-size: 28px;
        line-height: 1;
        font-weight: 600;
      }

      .count span {
        color: var(--muted);
        font-size: 12px;
      }

      section {
        border-bottom: 1px solid var(--line);
        padding: 24px 0;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 16px;
        line-height: 1.3;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      label {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 10px;
        align-items: start;
        min-height: 44px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
      }

      input {
        width: 18px;
        height: 18px;
        margin: 2px 0 0;
        accent-color: var(--mustard);
      }

      .item-title {
        display: block;
        font-size: 15px;
        line-height: 1.35;
        font-weight: 600;
      }

      .hint {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .flag {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--ink);
        font-size: 11px;
        font-weight: 600;
        vertical-align: 1px;
      }

      .danger {
        color: var(--coral);
      }

      @media (max-width: 680px) {
        main {
          width: min(100% - 24px, 980px);
          padding-top: 28px;
        }

        header {
          display: block;
        }

        .count {
          margin-top: 18px;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Checklist QA manual</h1>
          <p class="meta">
            Ronda de fixes Vibes. Marcá cada punto al verificarlo en iOS y,
            donde aplique, Android.
          </p>
        </div>
        <div class="count">
          <strong id="done">0/0</strong>
          <span>checks completos</span>
        </div>
      </header>

      <section>
        <h2>Signup y edad</h2>
        <ul>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Confirma tu edad no muestra chevron ni círculo.</span>
                <span class="hint">El botón superior izquierdo queda invisible/transparente, sin ícono ni fondo circular.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">El botón secundario “Atrás” sigue funcionando.</span>
                <span class="hint">Desde “Confirma tu edad”, tocar “Atrás” debe volver a la pantalla anterior.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Signup no muestra video/ilustración superior.</span>
                <span class="hint">La pantalla arranca directamente con el header y los controles de registro.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Consentimiento, botón y link a login quedan al bottom.</span>
                <span class="hint">El bloque inferior debe quedar alineado abajo con margen cómodo y sin quedar pegado al safe area.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Email ya registrado usa coral y respira antes del botón.</span>
                <span class="hint">Forzar un signup con email existente. El texto debe verse en coral Vibes y separado del CTA.</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section>
        <h2>Login</h2>
        <ul>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Login no muestra video/ilustración superior.</span>
                <span class="hint">Debe mantener social login, email/password, recuperación y navegación a signup.</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section>
        <h2>Onboarding</h2>
        <ul>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">En fecha de nacimiento del onboarding no se ve chevron back.</span>
                <span class="hint">Si aparece el paso de fecha dentro del flujo, mantener botón táctil sin flecha visible.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">La opción “Un poco de ambos” no aparece en Personalidad.</span>
                <span class="hint">Revisar onboarding y edición manual de “Un poco sobre vos”.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">“Comenzá el viaje por Vibes” no tiene botón Continuar.</span>
                <span class="hint">Debe mostrar loading automático y avanzar solo al home en aproximadamente 300 ms o al terminar el guardado.</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section>
        <h2>Home</h2>
        <ul>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">“Un poco sobre vos” no se abre automáticamente.</span>
                <span class="hint">Entrar a Home con usuario nuevo/completo y verificar que no navegue solo a preguntas de perfil.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Sin desafíos activos, Home muestra 3 desafíos recomendados.</span>
                <span class="hint">La sección debe titular “DESAFÍOS RECOMENDADOS” y listar desafíos públicos disponibles.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Con desafíos activos, Home muestra “DESAFÍOS ACTIVOS”.</span>
                <span class="hint">Las cards activas conservan pill de día, barra de progreso y badge pendiente/completado hoy.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Desafíos recomendados no muestran badge diario.</span>
                <span class="hint">No debe aparecer reloj/tilde en cards recomendadas que el usuario todavía no inició.</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section>
        <h2>Preferencias y mood</h2>
        <ul>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">“¿Cómo te sentís hoy?” tiene más margen bajo el título.</span>
                <span class="hint">Abrir el sheet y verificar separación clara entre título y chips.</span>
              </span>
            </label>
          </li>
        </ul>
      </section>

      <section>
        <h2>Regresiones rápidas</h2>
        <ul>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Signup social sigue mostrando modal de T&C.</span>
                <span class="hint">Google/Apple en signup deben pedir aceptación antes de continuar.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Login social no muestra modal de T&C.</span>
                <span class="hint">Google/Apple en login deben continuar sin la compuerta de términos.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Listados de Eventos/Desafíos conservan chevron naranja sin círculo.</span>
                <span class="hint">Verificar pantallas de listado, no las cards de Home.</span>
              </span>
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" />
              <span>
                <span class="item-title">Sobre mí mantiene chevron down naranja alineado con el nombre.</span>
                <span class="hint">Discover → usuario → Ver más.</span>
              </span>
            </label>
          </li>
        </ul>
      </section>
    </main>

    <script>
      const boxes = Array.from(document.querySelectorAll("input[type='checkbox']"));
      const done = document.getElementById("done");

      function updateCount() {
        const checked = boxes.filter((box) => box.checked).length;
        done.textContent = `${checked}/${boxes.length}`;
      }

      boxes.forEach((box, index) => {
        const key = `vibes-qa-check-${index}`;
        box.checked = localStorage.getItem(key) === "true";
        box.addEventListener("change", () => {
          localStorage.setItem(key, String(box.checked));
          updateCount();
        });
      });

      updateCount();
    </script>
  </body>
</html>
