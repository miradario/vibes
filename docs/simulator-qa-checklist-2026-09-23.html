<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibes Simulator QA Checklist</title>
    <style>
      :root {
        --bg: #fefefd;
        --surface: #fbf7ef;
        --surface-strong: #fffaf2;
        --text: #2b2b2b;
        --muted: #706d68;
        --line: #e8dfcc;
        --accent: #e4b76e;
        --accent-strong: #d88c7a;
        --ok: #4f7f63;
        --shadow: 0 18px 50px rgba(43, 43, 43, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        border-bottom: 1px solid var(--line);
        background: rgba(254, 254, 253, 0.92);
        backdrop-filter: blur(18px);
      }

      .wrap {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }

      .hero {
        padding: 28px 0 22px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 20px;
        align-items: end;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 64px);
        font-weight: 200;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.45;
      }

      .progress-card {
        min-width: 260px;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        background: var(--surface-strong);
        box-shadow: var(--shadow);
      }

      .progress-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: baseline;
      }

      .progress-number {
        font-size: 36px;
        font-weight: 300;
      }

      .progress-label {
        color: var(--muted);
        font-size: 13px;
      }

      .bar {
        height: 10px;
        border-radius: 999px;
        background: #ebe5d9;
        overflow: hidden;
        margin-top: 12px;
      }

      .bar-fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-strong));
        transition: width 0.2s ease;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 0 0 18px;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface-strong);
        color: var(--text);
        min-height: 40px;
        padding: 0 14px;
        cursor: pointer;
        font: inherit;
      }

      button:hover,
      button.active {
        border-color: var(--accent);
        background: #f7ebcf;
      }

      button.danger {
        margin-left: auto;
      }

      main {
        padding: 28px 0 56px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      section {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .section-head {
        padding: 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 400;
        letter-spacing: 0;
      }

      .pill {
        white-space: nowrap;
        border: 1px solid rgba(228, 183, 110, 0.4);
        background: rgba(228, 183, 110, 0.16);
        border-radius: 999px;
        padding: 5px 9px;
        color: #745526;
        font-size: 12px;
      }

      ul {
        list-style: none;
        padding: 8px 14px 14px;
        margin: 0;
      }

      li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 4px;
        border-bottom: 1px solid rgba(232, 223, 204, 0.72);
      }

      li:last-child {
        border-bottom: 0;
      }

      input[type="checkbox"] {
        appearance: none;
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        border: 1.5px solid #bba678;
        border-radius: 50%;
        margin-top: 1px;
        display: grid;
        place-items: center;
        cursor: pointer;
        background: #fffdf9;
      }

      input[type="checkbox"]:checked {
        border-color: var(--ok);
        background: var(--ok);
      }

      input[type="checkbox"]:checked::after {
        content: "";
        width: 6px;
        height: 10px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg) translate(-1px, -1px);
      }

      label {
        cursor: pointer;
        line-height: 1.35;
      }

      li.done label {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-thickness: 1px;
        text-decoration-color: rgba(79, 127, 99, 0.5);
      }

      .notes {
        grid-column: 1 / -1;
      }

      textarea {
        display: block;
        width: calc(100% - 36px);
        min-height: 160px;
        margin: 18px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        background: #fffdf9;
        color: var(--text);
        font: inherit;
        line-height: 1.45;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 820px) {
        .hero {
          grid-template-columns: 1fr;
        }

        .progress-card {
          min-width: 0;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        button.danger {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <div class="hero">
          <div>
            <h1>Vibes QA</h1>
            <p class="subtitle">
              Checklist interactivo para validar en simulator los cambios de home,
              descubrir, comunidad, eventos, onboarding, loader y backoffice.
            </p>
          </div>
          <div class="progress-card">
            <div class="progress-top">
              <div>
                <div class="progress-number" id="percent">0%</div>
                <div class="progress-label" id="count">0 de 0 validados</div>
              </div>
              <span class="pill" id="remaining">0 pendientes</span>
            </div>
            <div class="bar" aria-hidden="true">
              <div class="bar-fill" id="bar"></div>
            </div>
          </div>
        </div>
        <div class="toolbar" role="toolbar" aria-label="Filtros de checklist">
          <button class="active" data-filter="all" type="button">Todos</button>
          <button data-filter="pending" type="button">Pendientes</button>
          <button data-filter="done" type="button">Validados</button>
          <button id="expand-all" type="button">Mostrar todo</button>
          <button id="reset" class="danger" type="button">Reset</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="grid" id="checklist"></div>
    </main>

    <script>
      const storageKey = "vibes-simulator-qa-2026-09-23";
      const notesKey = `${storageKey}:notes`;
      const sections = [
        {
          title: "Home",
          items: [
            "Home activa muestra desafios activos, eventos proximos y sugerencias de personas con thumbnails/cards sobrias.",
            "No aparece campana de notificaciones arriba a la derecha.",
            "Debajo de Hola, Agustin aparece la frase original.",
            "No aparece la mano saludando.",
            "Card Completa tu perfil es compacta, solo dice Completa tu perfil, no tiene chevron y la X esta arriba a la derecha.",
            "Carouseles no tienen fondo propio; las cards si conservan su fondo.",
            "Botones, progress bars y acentos usan el naranja Vibes de progreso de perfil.",
            "Cards de desafios activos son compactas y no se sienten demasiado altas.",
            "Home sin eventos muestra mensaje y CTA visible para crear uno.",
            "Boton Crear evento no tiene icono.",
            "Home sin desafios activos no desborda texto del box.",
            "Desafio completado hoy no muestra Pendiente hoy.",
            "Inicio iOS no hace blink/flicker inicial.",
          ],
        },
        {
          title: "Titulos y fondos",
          items: [
            "Desafios, Eventos, Descubrir y Comunidad tienen misma fuente, color y tamanio que Descubrir.",
            "Desafios, Eventos, Descubrir y Comunidad tienen posicionamiento vertical consistente.",
            "Descubrir no muestra franja inferior gris/oscura.",
          ],
        },
        {
          title: "Comunidad y chats",
          items: [
            "Tabs Mensajes/Grupos no muestran badge cuando el contador es 0.",
            "Donde antes decia Challenges ahora dice Desafios.",
            "Chat de desafio: modal/lista de participantes no muestra cantidad en el titulo.",
            "Chat de evento: modal/lista equivalente no muestra cantidad en el titulo.",
            "Perfil de participante ya conectado no muestra boton Conectar.",
            "Perfil de participante no conectado muestra boton Conectar.",
            "Perfil desde chat no muestra numerador de fotos tipo 3 / 5.",
            "Perfil desde chat no muestra Reportar y bloquear.",
            "Boton Ver mas es mas ancho y visible.",
          ],
        },
        {
          title: "Descubrir",
          items: [
            "Perfil detalle usa chevron-back, no X.",
            "Swipe-right muestra animacion de burbujas/halo de like en iOS.",
            "X sin fondo en filtros/categorias funciona como volver/atras segun corresponda.",
          ],
        },
        {
          title: "Eventos",
          items: [
            "Eventos caducados aparecen siempre abajo como Eventos pasados.",
            "Toggle dice Ocultar pasados cuando estan visibles.",
            "Eventos vigentes no se mezclan con eventos pasados.",
          ],
        },
        {
          title: "Perfil y version",
          items: [
            "Perfil muestra version real de la app.",
            "Perfil muestra build number en texto chico.",
            "iOS build number esta en 26.",
          ],
        },
        {
          title: "Onboarding / ubicacion",
          items: [
            "Permite cargar ciudad manualmente.",
            "Permite cargar pais manualmente.",
            "Boton Usar mi ubicacion es visible.",
            "Usar mi ubicacion completa ciudad y pais correctamente.",
            "No repite ciudad en el label.",
            "Onboarding foto no vuelve a pedir ubicacion ni reescribe ciudad.",
          ],
        },
        {
          title: "Loading",
          items: [
            "VibesLoader usa colores sobrios de la app.",
            "No se ven azules viejos en la animacion.",
          ],
        },
        {
          title: "Force update / Backoffice",
          items: [
            "Supabase app_version_rules existe en remoto.",
            "Supabase fila global id = 1 existe y is_enabled = true.",
            "Supabase columnas de versiones y store URLs existen.",
            "Backoffice sidebar muestra Version app.",
            "Pantalla Version app carga sin error.",
            "Se puede setear Min supported.",
            "Se puede setear Latest.",
            "Se pueden setear URLs de App Store / Play Store.",
            "App muestra force update si version instalada < min supported.",
            "App muestra update recomendado si version instalada < latest.",
          ],
        },
        {
          title: "Backoffice labels",
          items: ["Sidebar usa Desafios en lugar de Challenges."],
        },
        {
          title: "Cierre",
          items: [
            "Sin issues bloqueantes.",
            "Issues menores anotados.",
            "Listo para commit/push final.",
          ],
        },
      ];

      const state = JSON.parse(localStorage.getItem(storageKey) || "{}");
      let filter = "all";

      const checklist = document.querySelector("#checklist");

      function itemId(sectionIndex, itemIndex) {
        return `s${sectionIndex}-i${itemIndex}`;
      }

      function save() {
        localStorage.setItem(storageKey, JSON.stringify(state));
      }

      function render() {
        checklist.innerHTML = "";
        sections.forEach((section, sectionIndex) => {
          const article = document.createElement("section");
          const doneCount = section.items.filter(
            (_, itemIndex) => state[itemId(sectionIndex, itemIndex)],
          ).length;

          article.innerHTML = `
            <div class="section-head">
              <h2>${section.title}</h2>
              <span class="pill">${doneCount}/${section.items.length}</span>
            </div>
            <ul></ul>
          `;

          const list = article.querySelector("ul");
          section.items.forEach((item, itemIndex) => {
            const id = itemId(sectionIndex, itemIndex);
            const checked = Boolean(state[id]);
            const shouldHide =
              (filter === "pending" && checked) || (filter === "done" && !checked);

            const li = document.createElement("li");
            li.className = `${checked ? "done" : ""}${shouldHide ? " hidden" : ""}`;
            li.innerHTML = `
              <input id="${id}" type="checkbox" ${checked ? "checked" : ""} />
              <label for="${id}">${item}</label>
            `;

            li.querySelector("input").addEventListener("change", (event) => {
              state[id] = event.target.checked;
              save();
              render();
            });

            list.appendChild(li);
          });

          if (filter !== "all" && !article.querySelector("li:not(.hidden)")) {
            article.classList.add("hidden");
          }

          checklist.appendChild(article);
        });

        const notes = document.createElement("section");
        notes.className = "notes";
        notes.innerHTML = `
          <div class="section-head">
            <h2>Observaciones</h2>
            <span class="pill">local</span>
          </div>
          <textarea id="notes" placeholder="Anota aca cualquier hallazgo del simulator..."></textarea>
        `;
        checklist.appendChild(notes);
        const textarea = notes.querySelector("textarea");
        textarea.value = localStorage.getItem(notesKey) || "";
        textarea.addEventListener("input", () => {
          localStorage.setItem(notesKey, textarea.value);
        });

        updateProgress();
      }

      function updateProgress() {
        const total = sections.reduce((sum, section) => sum + section.items.length, 0);
        const done = Object.values(state).filter(Boolean).length;
        const percent = total ? Math.round((done / total) * 100) : 0;
        document.querySelector("#percent").textContent = `${percent}%`;
        document.querySelector("#count").textContent = `${done} de ${total} validados`;
        document.querySelector("#remaining").textContent = `${total - done} pendientes`;
        document.querySelector("#bar").style.width = `${percent}%`;
      }

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          document
            .querySelectorAll("[data-filter]")
            .forEach((item) => item.classList.toggle("active", item === button));
          render();
        });
      });

      document.querySelector("#expand-all").addEventListener("click", () => {
        filter = "all";
        document
          .querySelectorAll("[data-filter]")
          .forEach((item) => item.classList.toggle("active", item.dataset.filter === "all"));
        render();
      });

      document.querySelector("#reset").addEventListener("click", () => {
        if (!confirm("Resetear todos los checks y observaciones?")) return;
        Object.keys(state).forEach((key) => delete state[key]);
        localStorage.removeItem(storageKey);
        localStorage.removeItem(notesKey);
        render();
      });

      render();
    </script>
  </body>
</html>
